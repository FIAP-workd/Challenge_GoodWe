name: Frontend - build e GitHub Pages

on:
  push:
    branches: [frontendteste, main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PRs e branches de teste validam o build sem acessar os secrets de producao.
  build-preview:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Validar TypeScript e gerar build de teste para o Pages
        run: npm run build -- --mode github-pages

  # O build de produção e o deploy usam as variáveis do ambiente producao.
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: producao
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Conferir configuração do Supabase no ambiente producao
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Configure SUPABASE_URL como variável e SUPABASE_PUBLISHABLE_KEY como secret no ambiente producao."
            exit 1
          elif [[ "$VITE_SUPABASE_PUBLISHABLE_KEY" != sb_publishable_* ]]; then
            echo "::error::Use apenas uma chave sb_publishable_ destinada ao navegador."
            exit 1
          fi

      - name: Instalar dependências do frontend
        run: npm ci

      - name: Gerar build de produção para o Pages
        run: npm run build -- --mode github-pages

      - name: Guardar build para publicação
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Publicar frontend no Pages
        id: deployment
        uses: actions/deploy-pages@v4
